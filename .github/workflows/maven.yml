# This workflow will build a Java project with Maven 
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ main ]
  schedule:
    - cron:  '2 7 * * *'
    # 每天中国时间0点2分 (UTC时间前一天16点2分)
    - cron:  '2 16 * * *'
    # 每天UTC时间0点2分
    - cron:  '2 0 * * *'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 1.8
      uses: actions/setup-java@v1
      with:
        java-version: 1.8
    - name: current date
      run: date
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    - name: Run Java Application
      run: java -jar target/bing-wallpaper-jar-with-dependencies.jar
      
    - name: Commit and Push files
      run: |
        git config --local user.email "szldgt@gmail.com"
        git config --local user.name "song-zl"
        
        # 1. 先把本地新抓取的壁纸全部添加并提交
        git add README.md bing-wallpaper.md picture/* docs/* zh-cn/* 2>/dev/null || true
        git commit -m "update readme.md" || echo "No changes to commit"
        
        # 2. 拉取远程最新的代码并进行合并（允许无关历史合并，防止冲突）
        git pull origin main --no-rebase || true
        
        # 3. 最终推送到远程 main 分支
        git push origin main || exit 0


